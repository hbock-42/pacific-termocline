name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes to a branch supersede in-flight runs; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The job id is the status-check name the `main` ruleset requires. Renaming
  # it silently un-gates the branch, so it stays `ci` (see ADR-0005).
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # ADR-0006: the visualizer is a browser app that also runs natively,
          # so the web target is built on every PR and cannot rot silently.
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # ADR-0006: the visualizer runs in a browser, where there is no
      # filesystem, so `termocline-format` has to build without the `fs`
      # feature that `RunReader::open` lives behind. Nothing else in the
      # workspace builds that way, so nothing else would notice the day a
      # `std::fs` import leaked into the core reader.
      - name: Check the format crate without its filesystem feature
        run: cargo check -p termocline-format --no-default-features

      # The other half of ADR-0006: the visualizer itself has to compile for
      # the browser. Nothing above builds `wasm32`, so a `std::fs` call or a
      # native-only dependency would reach `main` unnoticed.
      - name: Build the visualizer for the browser
        run: cargo build -p visualizer --target wasm32-unknown-unknown

      # ADR-0012: the browser runs the engine, so the engine has to compile for
      # it. This is what proves the `fs` split holds — the day a `std::fs` call
      # leaks into the simulation core, or an ungated module reaches for one,
      # this step is what says so.
      - name: Build the engine for the browser, without its filesystem feature
        run: cargo build -p engine --no-default-features --target wasm32-unknown-unknown

      # The build above compiles the library, not the test targets, and the
      # test run above compiles these with every feature on. So the acceptance
      # tests for the split are also run in the configuration they are about:
      # natively, so they can execute, with `fs` off, so an item behind the
      # feature creeping into them is a compile error rather than a silence.
      # `run_loop` is the browser's loop (ADR-0012), and half of that file is
      # skipped here because it holds the loop against the `run` command, which
      # needs the filesystem this configuration does not have.
      - name: Run the engine's filesystem-free tests without that feature
        run: cargo test -p engine --no-default-features --test filesystem_free_api --test run_loop

  # Non-blocking by design (T-10.1): a benchmark is a measurement, and a
  # measurement taken on a shared runner whose neighbours we do not control is
  # not a thing to fail a pull request on. `continue-on-error` keeps a slow or
  # broken run from blocking a merge, and the job id is deliberately *not*
  # `ci`, which is the one the `main` ruleset requires (ADR-0005).
  #
  # What it is for is the report: the figures land in the job summary, so a
  # change to the hot path arrives at review with numbers attached rather than
  # with an argument about whether it is faster (CODING_STANDARDS.md
  # § *Optimize against a measurement*).
  bench:
    name: bench (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `--quick` trades criterion's hundred samples for a single-pass
      # estimate. The full suite takes about a minute of wall clock on a warm
      # machine, which is more than a report on every pull request is worth;
      # a real comparison is run locally, per `docs/benchmarks.md`.
      # `pipefail` because the pipe into `tee` would otherwise report a failed
      # benchmark run as a success; the job is non-blocking either way, but a
      # summary that says nothing went wrong when something did is worse than
      # no summary.
      - name: Benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p engine -- --quick | tee benchmarks.txt

      - name: Report
        if: always()
        run: |
          {
            echo '## Benchmarks (report only, not a gate)'
            echo
            echo 'Grid cells per second for the right-hand side, timesteps per second'
            echo 'for a short scenario run. Runner hardware varies between jobs, so'
            echo 'compare figures within one run, not across pull requests.'
            echo
            echo '```'
            if [ -s benchmarks.txt ]; then
              cat benchmarks.txt
            else
              echo 'the benchmark run produced no output — see the Benchmark step'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
