[package]
name = "termocline-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-disk format shared by the engine and the visualizer: JSON header plus binary frames."

[dependencies]
bincode = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
termocline-grid.workspace = true

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
