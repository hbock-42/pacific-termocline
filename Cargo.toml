[workspace]
resolver = "2"
members = [
    "engine",
    "termocline-format",
    "termocline-grid",
    "termocline-numerics",
    "visualizer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hbock-42/pacific-termocline"

[workspace.dependencies]
# `fs` is opted into per crate: the visualizer's browser build has no
# filesystem to give `RunReader::open` (ADR-0006).
termocline-format = { path = "termocline-format", default-features = false }
termocline-grid = { path = "termocline-grid" }
termocline-numerics = { path = "termocline-numerics" }

# The physics validation suites integrate the solver for thousands of steps, so
# they are dominated by numeric loops rather than by test scaffolding. Building
# tests unoptimised made CI wall time grow with every validation ticket. This
# optimises the test profile while leaving `debug-assertions` and
# `overflow-checks` on, so the tests still check what a debug build checks.
[profile.test]
opt-level = 2
# Stated rather than inherited: optimising the tests must not quietly turn off
# the checks that make a debug build worth running.
debug-assertions = true
overflow-checks = true

# Dependencies of the tests get the same treatment; the numerics crates are
# where the loops actually live.
[profile.test.package."*"]
opt-level = 2

# The build a sampling profiler is pointed at (T-10.2, `docs/performance-notes.md`).
# Release code, so what is sampled is what a user runs, plus the debug info a
# sampler needs to turn a return address into a function name. Separate from
# `release` rather than switching symbols on there, so that what ships and what
# is profiled stay the same instructions built from the same flags.
[profile.profiling]
inherits = "release"
debug = true
