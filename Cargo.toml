[workspace]
resolver = "2"
members = [
    "engine",
    "termocline-format",
    "termocline-grid",
    "termocline-numerics",
    "visualizer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hbock-42/pacific-termocline"

[workspace.dependencies]
termocline-format = { path = "termocline-format" }
termocline-grid = { path = "termocline-grid" }
termocline-numerics = { path = "termocline-numerics" }
