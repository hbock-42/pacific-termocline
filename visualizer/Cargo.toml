[package]
name = "visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Renders a run: one computed in the browser, or one the engine wrote to disk."

[dependencies]
# ADR-0012: on the web the visualizer *is* the engine's caller — it holds a
# `Scenario` and steps it, because a browser has nothing to download. Default
# features off: `fs` is the filesystem half of the engine and `cli` is an
# argument parser, and a browser has neither. Natively the workspace turns both
# back on for the `termocline` binary, which is why this is a `default-features
# = false` and not a `no-default-features` build of two different engines.
engine = { path = "../engine", default-features = false }
termocline-format.workspace = true
# Named for the C-grid staggering the wind overlay averages across; the crate
# is data structures and indexing only, so it costs the browser build nothing
# (ADR-0006).
termocline-grid.workspace = true
# `wgpu`, not `glow`: it is the backend that reaches WebGPU, and the one whose
# native and web behaviour agree most closely (ADR-0006).
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.33"
# `eframe`'s `wgpu` feature takes `egui-wgpu` with its default features off,
# and those defaults are what turn on `wgpu/webgpu` — without them the crate
# does not compile for `wasm32` at all. Named here so the browser build has a
# backend; nothing in this crate calls into it directly.
egui-wgpu = "0.33"
log = "0.4"
# `std::time::Instant` panics on `wasm32-unknown-unknown`, and the compute loop
# needs a clock: it steps until a wall-clock deadline so that the tab keeps
# drawing (ADR-0012). `web-time` is `performance.now()` in a browser and a
# re-export of `std::time` everywhere else, so one line of code times both.
web-time = "1"

# The three ways a *written* run reaches the shell — a directory, a fetch, a
# drop — are native-only, because ADR-0012 does not serve the file format to
# the browser at all: the web build computes its runs and has nothing to load.
# `termocline-format`'s `fs` feature is deliberately still not enabled: the
# visualizer reads a directory into the same byte buffers a drop hands it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ehttp = "0.7"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU is the backend; WebGL2 is the fallback where a browser has no WebGPU
# (ADR-0006). `wgpu` is named only to add that fallback to what `egui-wgpu`
# already asks for.
wgpu = { version = "27", default-features = false, features = ["webgl"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "Performance",
    "UrlSearchParams",
    "Window",
] }

[dev-dependencies]
# `pages_deploy.rs` reads the repository URL out of the workspace manifest, so
# that what the deploy is checked against is the repository itself rather than
# a second copy of its name. Parse only: nothing here writes TOML.
toml = { version = "0.9", default-features = false, features = ["parse"] }
bincode = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "termocline-viz"
path = "src/main.rs"

[lib]
name = "visualizer"
path = "src/lib.rs"
# `cdylib` is what `wasm-bindgen` links the browser build from; `rlib` is what
# the binary and the tests link.
crate-type = ["cdylib", "rlib"]
