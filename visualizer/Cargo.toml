[package]
name = "visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads the engine's output files and renders them. Never touches the physics."

[dependencies]
termocline-format.workspace = true
# The same encoding `termocline-format` writes frames in, so one frame can be
# decoded from the offset noted for it at load rather than by walking the run
# forward to it (T-08.3, `run::LoadedRun::frame`).
bincode = { version = "2", features = ["serde"] }
# `wgpu`, not `glow`: it is the backend that reaches WebGPU, and the one whose
# native and web behaviour agree most closely (ADR-0006).
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.33"
# `eframe`'s `wgpu` feature takes `egui-wgpu` with its default features off,
# and those defaults are what turn on `wgpu/webgpu` — without them the crate
# does not compile for `wasm32` at all. Named here so the browser build has a
# backend; nothing in this crate calls into it directly.
egui-wgpu = "0.33"
# One HTTP client for both targets, so `?run=` on the web and a typed URL
# natively take the same code path.
ehttp = "0.7"
log = "0.4"

# The folder picker and the logger only mean something where there is a
# filesystem and a terminal (ADR-0006). `termocline-format`'s `fs` feature is
# deliberately *not* enabled: the visualizer reads a directory into the same
# byte buffers the web hands it, so both targets take one code path and neither
# depends on `RunReader::open`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU is the backend; WebGL2 is the fallback where a browser has no WebGPU
# (ADR-0006). `wgpu` is named only to add that fallback to what `egui-wgpu`
# already asks for.
wgpu = { version = "27", default-features = false, features = ["webgl"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "UrlSearchParams",
    "Window",
] }

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "termocline-viz"
path = "src/main.rs"

[lib]
name = "visualizer"
path = "src/lib.rs"
# `cdylib` is what `wasm-bindgen` links the browser build from; `rlib` is what
# the binary and the tests link.
crate-type = ["cdylib", "rlib"]
