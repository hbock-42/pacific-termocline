[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless simulation core: runs a scenario forward in time and writes the ocean state to disk."

[features]
# T-10.4's instrument, and nothing else: it stores every prognostic state at
# `f32` so that Epic 07's validation suite can be re-run at the width the
# ticket proposes, with none of its tolerances touched. Off in every build the
# project produces, and enabled by no target here — `engine/src/precision.rs`
# says what it emulates and `docs/performance-notes.md` reports what it
# measured. Turning it on makes the engine unscientific on purpose.
f32-storage-probe = []

[dependencies]
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
termocline-format = { workspace = true, features = ["fs"] }
termocline-grid.workspace = true
termocline-numerics.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }

[dev-dependencies]
criterion = "0.8"

# `bench = false` on both: neither carries a `#[bench]`, and leaving them in
# makes `cargo bench` run two empty libtest harnesses that reject criterion's
# own arguments before the benchmarks are reached.
[[bin]]
name = "termocline"
path = "src/main.rs"
bench = false

[lib]
name = "engine"
path = "src/lib.rs"
bench = false

# Epic 10's measurements. `harness = false` because criterion brings its own
# `main`, and `test = false` because a criterion benchmark run under
# `cargo test` measures nothing while costing a full short scenario run;
# `tests/benchmark_workloads.rs` is what the gate checks about them.
[[bench]]
name = "rhs_evaluation"
harness = false
test = false

[[bench]]
name = "scenario_run"
harness = false
test = false
