[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless simulation core: runs a scenario forward in time and writes the ocean state to disk."

# T-10.4's instrument is a `--cfg` flag rather than a cargo feature, and
# deliberately so: CI runs `cargo test --workspace --all-features`, which would
# switch a feature on, and the whole point of this probe is that it stores every
# prognostic state at `f32` — an engine no Epic 07 budget is derived against.
# `--all-features` cannot reach a `--cfg`, so the gate stays a gate.
#
#     RUSTFLAGS="--cfg f32_storage_probe" cargo test -p engine --no-fail-fast
#
# `engine/src/precision.rs` says what it emulates, `docs/performance-notes.md`
# reports what it measured, and `engine/tests/f32_field_storage.rs` guards that
# an ordinary build does not carry it. Turning it on makes the engine
# unscientific on purpose.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(f32_storage_probe)'] }

# `fs` is what a filesystem buys: loading a scenario from a path, writing a run
# into a directory, reading one back, and the benchmark harness that does both.
# It is off in the browser, which has none of them (ADR-0012); `engine/src/lib.rs`
# § *The `fs` feature* is the account of what is behind it and what is not.
#
# `cli` is the `termocline` binary's own dependencies, and the binary's
# `required-features`. It is separate because `clap` is not a filesystem: a
# caller who wants `Scenario::load` in a library should not be made to build an
# argument parser for it.
[features]
default = ["cli", "fs"]
fs = ["termocline-format/fs"]
cli = ["fs", "dep:clap"]

[dependencies]
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
termocline-format = { workspace = true }
termocline-grid.workspace = true
termocline-numerics.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }

[dev-dependencies]
criterion = "0.8"

# `bench = false` on both: neither carries a `#[bench]`, and leaving them in
# makes `cargo bench` run two empty libtest harnesses that reject criterion's
# own arguments before the benchmarks are reached.
[[bin]]
name = "termocline"
path = "src/main.rs"
bench = false
# The CLI is a native program: it parses arguments, loads a scenario from a
# path and writes a run to a directory. `cargo build -p engine
# --no-default-features` skips it rather than failing to compile it.
required-features = ["cli"]

[lib]
name = "engine"
path = "src/lib.rs"
bench = false

# Epic 10's measurements. `harness = false` because criterion brings its own
# `main`, and `test = false` because a criterion benchmark run under
# `cargo test` measures nothing while costing a full short scenario run;
# `tests/benchmark_workloads.rs` is what the gate checks about them.
[[bench]]
name = "rhs_evaluation"
harness = false
test = false

[[bench]]
name = "scenario_run"
harness = false
test = false
